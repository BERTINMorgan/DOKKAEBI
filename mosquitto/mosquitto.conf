# Broker MQTT local du van — LAN uniquement (pas d'exposition Internet).
# Hypothèse : le WiFi du van est un réseau de confiance isolé.
# Pour durcir : remplacer allow_anonymous par un password_file (voir README).
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type all
